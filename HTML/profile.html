<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/CSS/stayle.css" />
    <title>profile Page</title>
  </head>

  <body>
    <!-- LOG IN MODAL -->
    <div
      class="modal fade"
      id="loginModal"
      tabindex="-1"
      aria-labelledby="loginModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="loginModalTitle">Log in</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="username" class="col-form-label">UserName:</label>
                <input type="text" class="form-control" id="username" />
              </div>
              <div class="mb-3">
                <label for="pass" class="col-form-label">Password:</label>
                <input type="password" class="form-control" id="pass" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-primary" onclick="logInBtn()">
              Log in
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //LOG IN MODAL// -->
    <!-- Succsess Module -->
    <div id="succsessAlert" class="success-massege"></div>
    <!-- //Succsess Module// -->

    <!--REG MODAL -->
    <div
      class="modal fade"
      id="RegModal"
      tabindex="-1"
      aria-labelledby="loginModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="loginModalTitle">
              Register a New User
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="username" class="col-form-label">Name:</label>
                <input type="text" class="form-control" id="reg-name" />
              </div>
              <div class="mb-3">
                <label for="username" class="col-form-label">UserName:</label>
                <input type="text" class="form-control" id="reg-username" />
              </div>
              <div class="mb-3">
                <label for="pass" class="col-form-label">Password:</label>
                <input type="password" class="form-control" id="reg-pass" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-primary" onclick="RegBtn()">
              Register
            </button>
          </div>
        </div>
      </div>
    </div>
    <!--//REG MODAL -->

    <!--DELETE POST MODAL -->
    <div
      class="modal fade"
      id="deleteModal"
      tabindex="-1"
      aria-labelledby="deleteModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="deleteModalTitle">Delete Post</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p class="mb-0">Are you sure you want to delete this post?</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-danger"
              onclick="confirmDelete()"
            >
              Delete The Post
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- //DELETE POST MODAL// -->

    <div class="container shadow rounded p-0">
      <!-- NAV BAR -->
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <span class="navbar-brand fw-bold">SocialWeb</span>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="profile.html">Profile</a>
              </li>
            </ul>
            <!-- FOR NON-LOGED IN USER -->
            <div class="d-flex w-100 justify-content-end p-2">
              <button
                id="login-btn"
                type="button"
                class="btn btn-outline-success"
                data-bs-toggle="modal"
                data-bs-target="#loginModal"
              >
                Log in
              </button>
              <button
                id="Register-btn"
                type="button"
                class="btn btn-outline-secondary ms-3"
                data-bs-toggle="modal"
                data-bs-target="#RegModal"
              >
                Register
              </button>
            </div>
            <!-- //FOR NON-LOGED IN USER -->
            <div class="d-flex bg" id="logOutDiv">
              <!-- FOR LOGED IN USER -->

              <img
                class="rounded-circle pofile-pics"
                src="/Assetes/Profile/profile.png"
              />
              <p class="mt-2 mx-2" id="profileUserName"></p>
              <button
                id="logedOut"
                type="button"
                class="btn btn-outline-danger"
                onclick="logout()"
              >
                Logout
              </button>
            </div>
            <!-- //FOR LOGED IN USER -->
          </div>
        </div>
      </nav>
    </div>
    <!-- //NAV BAR// -->

    <!-- CONTENT -->
    <div class="container mt-5">
      <!-- PROFILE CARD -->
      <div class="card shadow profile-card">
        <div class="card-body">
          <div class="row align-items-center">
            <!-- avatar -->
            <div class="col-12 col-md-2 text-center mb-3 mb-md-0">
              <img
                src="/Assetes/Profile/profile.png"
                class="pofile-pics profile-avatar rounded-circle border border-3 border-dark"
              />
            </div>

            <!-- name + username -->
            <div
              class="col-12 col-md-5 text-center text-md-start mb-3 mb-md-0 d-flex justify-content-between bg-dange"
            >
              <div>
                <h5 class="fw-bold mb-3">Name:</h5>
                <h5 class="fw-bold mb-0" id="profName">Loading...</h5>
              </div>
              <div class="mt">
                <h5 class="fw-bold mb-3 merg-left">Email:</h5>
                <h5 class="fw-bold merg-left" id="profEmail">Loading...</h5>
              </div>
            </div>

            <!-- stats -->
            <!-- Removed ms-5, added text-md-end for right-alignment if needed -->
            <div class="col-12 col-md-5 s-1 text-md-end">
              <div class="stat d-inline-block me-3 me-5">
                <span class="stat-number" id="postCount">0</span>
                <span class="stat-label">Posts</span>
              </div>
              <div class="stat d-inline-block me-5">
                <span class="stat-number" id="comCount">0</span>
                <span class="stat-label">Comments</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- //PROFILE CARD// -->

      <!-- USER POSTS -->
      <h1 class="mt-5 mb-4" id="profialeUserName">
        <span>Username</span> Posts:
      </h1>
      <div id="profile-posts"></div>
      <!-- //USER POSTS// -->
    </div>
    <!-- //CONTENT// -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/node_modules/axios/dist/axios.js"></script>
    <script type="module" src="/JS/script.js"></script>
    <script type="module" src="/JS/profile.js"></script>
  </body>
</html>
