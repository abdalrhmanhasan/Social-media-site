<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/CSS/stayle.css" />
    <title>Home Page</title>
  </head>

  <body>
    <!-- LOG IN MODULE -->
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">New message</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label  for="recipient-name" class="col-form-label"
                  >UserName:</label
                >
                <input type="text" class="form-control" id="username" />
              </div>
              <div class="mb-3">
                <label for="message-text" class="col-form-label"
                  >Password:</label
                >
                <input type="text" class="form-control" id="pass" />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-primary" onclick="logInBtn()">Log in</button>
          </div>
        </div>
      </div>
    </div>
    <!-- //LOG IN MODULE// -->

    <div class="container shadow rounded">
      <!-- NAV BAR -->
      <nav class="navbar navbar-expand-lg nav-light bg-body-tertiary">
        <div class="container-fluid">
          <b class="navbar-brand" href="#">Tarmeez</b>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Profile</a>
              </li>
            </ul>
            <div class="d-flex w-100 justify-content-end p-2">
              <button
                type="button"
                class="btn btn-outline-success"
                data-bs-toggle="modal"
                data-bs-target="#exampleModal"
              >
                Log in
              </button>
              <button type="button" class="btn btn-outline-secondary ms-3">
                Register
              </button>
            </div>
          </div>
        </div>
      </nav>
    </div>
    <!-- //NAV BAR// -->

    <!-- CONTENT -->
    <div class="container mt-5">
      <!-- posts -->
      <div id="posts">
        <!-- post -->
        <h1>Loading...</h1>
        <!-- //post //-->
      </div>
      <!-- //posts// -->
    </div>
    <!-- //CONTENT// -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/node_modules/axios/dist/axios.js"></script>
    <script type="module" src="/JS/script.js"></script>
  </body>
</html>
